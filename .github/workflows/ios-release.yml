name: iOS TestFlight Release

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

env:
  IOS_PROJECT: Sandy.xcodeproj
  IOS_SCHEME: Sandy

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Validate version tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like ios-v1.0.0, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project "$IOS_PROJECT" -scheme "$IOS_SCHEME"
      - name: Select iPhone simulator
        working-directory: ios
        shell: bash
        run: |
          simulator_udid="$(python3 ci/select_simulator.py --preferred-name 'iPhone 16e')"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Run iOS tests
        working-directory: ios
        run: >-
          xcodebuild test
          -project "$IOS_PROJECT"
          -scheme "$IOS_SCHEME"
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID"
          CODE_SIGNING_ALLOWED=NO

  upload:
    needs: test
    runs-on: macos-26
    environment: testflight
    steps:
      - uses: actions/checkout@v6

      - name: Derive release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Validate release configuration
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          required=(
            APPLE_TEAM_ID:APPLE_TEAM_ID
            IOS_PROVISIONING_PROFILE_NAME:PROFILE_NAME
            APP_STORE_CONNECT_KEY_ID:API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID:API_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64:API_KEY_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_BASE64:CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64:PROFILE_BASE64
          )
          missing=()
          for entry in "${required[@]}"; do
            setting_name="${entry%%:*}"
            environment_name="${entry##*:}"
            if [[ -z "${!environment_name}" ]]; then
              missing+=("$setting_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing TestFlight environment values: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Install signing material
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain_path="$RUNNER_TEMP/sandy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/sandy-distribution.p12"
          profile_source="$RUNNER_TEMP/sandy-app-store.mobileprovision"

          if ! printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not valid Base64."
            exit 1
          fi
          pkcs12_options=()
          if openssl pkcs12 -help 2>&1 | grep -q -- '-legacy'; then
            pkcs12_options+=(-legacy)
          fi
          if ! openssl pkcs12 "${pkcs12_options[@]}" -in "$certificate_path" -passin env:CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::The distribution certificate is not a valid PKCS#12 file for IOS_DISTRIBUTION_CERTIFICATE_PASSWORD. Export the Apple Distribution certificate and private key as a password-protected .p12, then Base64-encode that binary file."
            exit 1
          fi
          if ! printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile_source"; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not valid Base64."
            exit 1
          fi
          if ! security cms -D -i "$profile_source" > "$RUNNER_TEMP/profile.plist"; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 does not contain a valid provisioning profile."
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          profile_path="$profile_directory/$profile_uuid.mobileprovision"
          cp "$profile_source" "$profile_path"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_path=$profile_path" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        id: api_key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          if ! printf '%s' "$API_KEY_BASE64" | base64 --decode > "$api_key_path"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 is not valid Base64."
            exit 1
          fi
          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 does not contain an App Store Connect .p8 private key."
            exit 1
          fi
          chmod 600 "$api_key_path"
          echo "path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Archive app
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: >-
          xcodebuild archive
          -project "$IOS_PROJECT"
          -scheme "$IOS_SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Sandy.xcarchive"
          MARKETING_VERSION="$MARKETING_VERSION"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          SANDY_DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          SANDY_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          SANDY_OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Create export options
        shell: python
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {"net.rdln.sandy": os.environ["PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False,
              "uploadSymbols": True,
              "testFlightInternalTestingOnly": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as file:
              plistlib.dump(options, file)

      - name: Upload internal TestFlight build
        env:
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Sandy.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -exportPath "$RUNNER_TEMP/TestFlightExport"
          -authenticationKeyPath "$API_KEY_PATH"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_PATH: ${{ steps.signing.outputs.profile_path }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        shell: bash
        run: |
          keychain_path="${KEYCHAIN_PATH:-$RUNNER_TEMP/sandy-signing.keychain-db}"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          if [[ -n "$PROFILE_PATH" && -f "$PROFILE_PATH" ]]; then
            rm -f "$PROFILE_PATH"
          fi
          if [[ -n "$API_KEY_PATH" && -f "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/sandy-distribution.p12" \
            "$RUNNER_TEMP/sandy-app-store.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
