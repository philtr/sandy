name: Publish server image

on:
  push:
    branches: [main, master]
    tags: ["server-v*"]
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer image version (for example 1.2.3 or 2.0.0-alpha1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#server-v}"
          fi

          if [[ -n "$version" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid SemVer: $version" >&2
              exit 1
            fi
            echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            if [[ "$version" == *-* ]]; then
              echo "stable=false" >> "$GITHUB_OUTPUT"
            else
              echo "stable=true" >> "$GITHUB_OUTPUT"
            fi
          else
            version="0.0.0"
            echo "major=0" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=v${{ steps.version.outputs.major }}-latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=sha,prefix=sha-
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
