name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Sandy.xcodeproj -scheme Sandy
      - name: Select iPhone simulator
        working-directory: ios
        shell: bash
        run: |
          simulator_udid="$(python3 ci/select_simulator.py --preferred-name 'iPhone 16e')"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Run iOS tests
        working-directory: ios
        run: >-
          xcodebuild test
          -project Sandy.xcodeproj
          -scheme Sandy
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID"
          CODE_SIGNING_ALLOWED=NO
